[project]
name = "work-tracker-backend"
version = "0.1.0"
description = "Local LAN work-event tracker API"
requires-python = ">=3.11"
dependencies = ["alembic>=1.13,<2", "fastapi>=0.115,<0.116", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
